name: Deploy Firebase Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase/storage.rules'
      - 'firebase/database.rules.json'
      - 'firebase.json'
      - '.github/workflows/deploy-rules.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase deploy secrets
        # secrets.* can't be referenced directly in a step's `if:` — same
        # pattern as deploy-functions.yml's own gate. Stays a no-op until
        # those secrets are set rather than failing the pipeline.
        id: firebase_secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Firebase CLI
        if: steps.firebase_secrets.outputs.present == 'true'
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        # credentials_json needs the actual JSON content, not base64 — see
        # deploy-functions.yml's own comment on this same step.
        if: steps.firebase_secrets.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Storage and Database rules
        # Unlike Cloud Functions' --only functions:name,name (which only
        # ever touches the exact functions listed, leaving everything else
        # in the project alone), a rules deploy is a FULL REPLACE of that
        # service's entire ruleset — there's no per-path/per-node scoping
        # available. This bucket and (potentially) this Realtime Database
        # instance are shared with other apps on the same Firebase project
        # (see storage.rules' own comment) — if either of them has rules of
        # its own that only exist in the Firebase Console and were never
        # added to firebase/storage.rules or firebase/database.rules.json
        # in this repo, this deploy will silently remove those rather than
        # just adding this app's. Confirm the live rules match these files
        # (plus whatever the other app needs) before relying on this
        # workflow, and any time either file changes going forward.
        if: steps.firebase_secrets.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase deploy --only storage,database --project "$FIREBASE_PROJECT_ID" --non-interactive
