name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        # Uses the real Firebase config from a repo secret when available
        # (Settings -> Secrets and variables -> Actions -> GOOGLE_SERVICES_JSON,
        # base64-encoded contents of your Firebase google-services.json).
        # Falls back to the checked-in placeholder so the build stays green
        # for contributors/forks without Firebase credentials.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check release signing secrets
        # secrets.* can't be referenced directly in a step's `if:` — it must
        # be resolved to a step output (or env var) first, so downstream
        # steps gate on `steps.release_secrets.outputs.present` instead.
        # Moved ahead of the debug build (see below) so that build can skip
        # itself when this run is about to produce a signed release anyway.
        id: release_secrets
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        # Merge-gate validation for PRs, and a fallback installable artifact
        # on pushes to main when release signing isn't configured. Skipped
        # when this run is about to build+sign a release APK anyway —
        # assembleRelease compiles the exact same source, so assembleDebug
        # first would just be paying for the same compile twice.
        if: steps.release_secrets.outputs.present != 'true'
        env:
          GLIMPSE_RELEASES_TOKEN: ${{ secrets.GLIMPSE_RELEASES_TOKEN }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Read app version
        # Used to name the APK/GitHub Release meaningfully instead of the
        # generic app-debug.apk / app-release.apk / "build-<run number>".
        id: app_version
        run: |
          VERSION_NAME=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename debug APK
        # version_name alone is static (bumped by hand for real product
        # releases), so every CI build produced an identically-named file —
        # the run number is what actually changes build-to-build.
        if: steps.release_secrets.outputs.present != 'true'
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/Glimpse-v${{ steps.app_version.outputs.version_name }}-build${{ github.run_number }}-debug.apk"

      - name: Decode release keystore
        # See README for how to generate/add RELEASE_KEYSTORE_BASE64 and
        # friends as repo secrets.
        if: steps.release_secrets.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build signed release APK
        if: steps.release_secrets.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GLIMPSE_RELEASES_TOKEN: ${{ secrets.GLIMPSE_RELEASES_TOKEN }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK
        if: steps.release_secrets.outputs.present == 'true'
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/Glimpse-v${{ steps.app_version.outputs.version_name }}-build${{ github.run_number }}-release.apk"

      - name: Upload debug APK artifact
        # Only publish once changes land on main — PRs just need to prove
        # the build is green, not produce a downloadable artifact. Also
        # skipped whenever the debug build itself was skipped (a signed
        # release was built instead) — nothing to upload in that case.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.release_secrets.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with signed APK
        if: steps.release_secrets.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version_name }}-build${{ github.run_number }}
          name: Glimpse v${{ steps.app_version.outputs.version_name }} (build ${{ github.run_number }})
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
