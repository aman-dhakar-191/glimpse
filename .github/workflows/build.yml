name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        # Uses the real Firebase config from a repo secret when available
        # (Settings -> Secrets and variables -> Actions -> GOOGLE_SERVICES_JSON,
        # base64-encoded contents of your Firebase google-services.json).
        # Falls back to the checked-in placeholder so the build stays green
        # for contributors/forks without Firebase credentials.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # Runs on every PR and push as the merge-gate validation.
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode release keystore
        # Only meaningful on push to main — release signing secrets aren't
        # needed for PR validation. See README for how to generate/add
        # RELEASE_KEYSTORE_BASE64 and friends as repo secrets.
        if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          secrets.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build signed release APK
        if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          secrets.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK artifact
        # Only publish once changes land on main — PRs just need to prove
        # the build is green, not produce a downloadable artifact.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with signed APK
        if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          secrets.RELEASE_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glimpse build #${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
