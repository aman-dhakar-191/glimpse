name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        # Uses the real Firebase config from a repo secret when available
        # (Settings -> Secrets and variables -> Actions -> GOOGLE_SERVICES_JSON,
        # base64-encoded contents of your Firebase google-services.json).
        # Falls back to the checked-in placeholder so the build stays green
        # for contributors/forks without Firebase credentials.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # Runs on both PR (validation that the project compiles) and push to
        # main (produces the artifact below), so a PR failing this step is
        # the merge gate.
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        # Only publish the APK once changes land on main — PRs just need to
        # prove the build is green, not produce a downloadable artifact.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
