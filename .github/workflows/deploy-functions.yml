name: Deploy Cloud Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase deploy secrets
        # secrets.* can't be referenced directly in a step's `if:` — same
        # pattern as build.yml's release-signing gate. Deploying Cloud
        # Functions needs the Blaze plan (see README), so this stays a
        # no-op until that's set up rather than failing the pipeline.
        id: firebase_secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.firebase_secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        if: steps.firebase_secrets.outputs.present == 'true'
        working-directory: functions
        run: npm install

      - name: Decode Firebase service account
        # Emitted as a step output (not just a file) because
        # google-github-actions/auth's credentials_json input wants the raw
        # JSON string — the heredoc form of GITHUB_OUTPUT handles the
        # multi-line JSON safely.
        if: steps.firebase_secrets.outputs.present == 'true'
        id: decode_service_account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          {
            echo "json<<FIREBASE_SA_EOF"
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d
            echo "FIREBASE_SA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        # firebase-tools' own CLI auth doesn't reliably pick up a bare
        # GOOGLE_APPLICATION_CREDENTIALS env var for deploys ("Failed to
        # authenticate, have you run firebase login?") — this action is the
        # officially documented way to set up service-account credentials
        # that both the Firebase CLI and underlying gcloud/Cloud Build calls
        # respect.
        if: steps.firebase_secrets.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.decode_service_account.outputs.json }}

      - name: Deploy Cloud Functions
        if: steps.firebase_secrets.outputs.present == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx firebase-tools deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
