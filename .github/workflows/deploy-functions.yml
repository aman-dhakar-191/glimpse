name: Deploy Cloud Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase deploy secrets
        # secrets.* can't be referenced directly in a step's `if:` — same
        # pattern as build.yml's release-signing gate. Deploying Cloud
        # Functions needs the Blaze plan (see README), so this stays a
        # no-op until that's set up rather than failing the pipeline.
        id: firebase_secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.firebase_secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        if: steps.firebase_secrets.outputs.present == 'true'
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        if: steps.firebase_secrets.outputs.present == 'true'
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        # credentials_json accepts the key as either raw JSON or base64.
        if: steps.firebase_secrets.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Functions
        # firebase-tools' own CLI auth doesn't reliably pick up
        # GOOGLE_APPLICATION_CREDENTIALS just from the auth step above ("Failed
        # to authenticate, have you run firebase login?") — it needs to be
        # exported in the same step that actually runs the deploy.
        if: steps.firebase_secrets.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
